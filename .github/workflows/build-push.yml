# build-push.yml
#
# CI pipeline for Spring Petclinic Microservices.
# Triggered on push to main. Detects which of the 8 service directories changed,
# builds ARM64 Docker images for changed services only, scans with Trivy,
# pushes to ECR (dev), then dispatches an event to the platform repo so
# update-image-tags.yml can commit the new tag to helm-values/.
#
# Prerequisites — GitHub repository SECRETS:
#   AWS_ROLE_ARN        — OIDC IAM role ARN (output of petclinic github-oidc module)
#   PLATFORM_REPO_TOKEN — GitHub PAT with contents:write + metadata:read on the
#                         platform repo.
#
# Prerequisites — GitHub repository VARIABLES:
#   AWS_REGION      — AWS region (eu-central-1)
#   AWS_ACCOUNT_ID  — AWS account ID (used to construct ECR registry URL)
#   PLATFORM_REPO   — Platform repository path
#                     (example: AnuradhaVIyer/petclinic-platform)
#
# Reusable workflow:
#   .github/workflows/ecr-build-push.yml handles the per-service build,
#   Trivy scan, and ECR push. This file orchestrates change detection and
#   the post-push dispatch only.

name: Build and Push Docker Images

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      force-all:
        description: "Build all services regardless of changes"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  id-token: write
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Detect changed services
  # ────────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has-changes: ${{ steps.build-matrix.outputs.has-changes }}
      services: ${{ steps.build-matrix.outputs.services }}
      sha: ${{ steps.build-matrix.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed service directories
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            config-server:
              - 'spring-petclinic-config-server/**'

            discovery-server:
              - 'spring-petclinic-discovery-server/**'

            api-gateway:
              - 'spring-petclinic-api-gateway/**'

            customers-service:
              - 'spring-petclinic-customers-service/**'

            visits-service:
              - 'spring-petclinic-visits-service/**'

            vets-service:
              - 'spring-petclinic-vets-service/**'

            genai-service:
              - 'spring-petclinic-genai-service/**'

            admin-server:
              - 'spring-petclinic-admin-server/**'

      - name: Build service matrix
        id: build-matrix
        shell: bash
        run: |
          ALL_SERVICES=(
            config-server
            discovery-server
            api-gateway
            customers-service
            visits-service
            vets-service
            genai-service
            admin-server
          )

          SHA="${GITHUB_SHA::7}"
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

          # Manual dispatch → optionally force all services
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && \
             [ "${{ github.event.inputs.force-all }}" == "true" ]; then

            echo "Manual dispatch — building all services"
            services=("${ALL_SERVICES[@]}")

          else
            services=()

            [ "${{ steps.filter.outputs.config-server }}" = "true" ] && \
              services+=("config-server")

            [ "${{ steps.filter.outputs.discovery-server }}" = "true" ] && \
              services+=("discovery-server")

            [ "${{ steps.filter.outputs.api-gateway }}" = "true" ] && \
              services+=("api-gateway")

            [ "${{ steps.filter.outputs.customers-service }}" = "true" ] && \
              services+=("customers-service")

            [ "${{ steps.filter.outputs.visits-service }}" = "true" ] && \
              services+=("visits-service")

            [ "${{ steps.filter.outputs.vets-service }}" = "true" ] && \
              services+=("vets-service")

            [ "${{ steps.filter.outputs.genai-service }}" = "true" ] && \
              services+=("genai-service")

            [ "${{ steps.filter.outputs.admin-server }}" = "true" ] && \
              services+=("admin-server")
          fi

          if [ ${#services[@]} -eq 0 ]; then
            echo "No service directories changed — skipping build."

            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "services=" >> $GITHUB_OUTPUT

          else
            MATRIX=$(printf '"%s"\n' "${services[@]}" | jq -sc .)

            echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
            echo "services=${services[*]}" >> $GITHUB_OUTPUT

            echo "Changed services (${#services[@]}): ${services[*]}"
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Build, scan, push
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.service }}

    needs: detect-changes

    if: needs.detect-changes.outputs.has-changes == 'true'

    strategy:
      fail-fast: false

      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    uses: ./.github/workflows/ecr-build-push.yml

    with:
      service: ${{ matrix.service }}
      sha: ${{ needs.detect-changes.outputs.sha }}
      aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}
      aws-account-id: ${{ vars.AWS_ACCOUNT_ID }}

    secrets: inherit

  # ────────────────────────────────────────────────────────────────────────────
  # Job 3: Notify platform repo
  # ────────────────────────────────────────────────────────────────────────────
  notify:
    name: Notify platform repo

    needs:
      - detect-changes
      - build

    if: |
      always() &&
      needs.detect-changes.outputs.has-changes == 'true' &&
      needs.build.result == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Dispatch app-image-built to platform repo
        uses: peter-evans/repository-dispatch@v3

        with:
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}
          repository: ${{ vars.PLATFORM_REPO }}
          event-type: app-image-built

          client-payload: |
            {
              "sha": "${{ needs.detect-changes.outputs.sha }}",
              "services": "${{ needs.detect-changes.outputs.services }}"
            }
